<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Test</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="websocket-page">
    <div class="app">
        <header class="page-heading">
            <h2>WebSocket Test</h2>
            <a class="home-link" href="/">Home</a>
        </header>

        <div class="card">
            <div class="toolbar">
                <input
                    type="text"
                    id="endpointInput"
                    value="wss://localhost:8085/websocket_ep"
                    placeholder="Enter WebSocket endpoint"
                />
                <button id="connectButton" class="primary">Connect</button>
            </div>

            <div class="status-row">
                <div class="badge">
                    <span id="statusDot" class="dot disconnected"></span>
                    <span id="statusText">Disconnected</span>
                </div>
                <span class="muted">Vanilla JS demo</span>
            </div>
        </div>

        <div class="section-gap">
            <div class="panel">
                <div class="header">
                    <span>Messages</span>
                </div>
                <div id="messages"></div>
            </div>
        </div>

        <div class="section-gap">
            <div class="composer">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message to send"
                    disabled
                />
                <button id="sendButton" class="secondary" disabled>Send</button>
            </div>
        </div>

        <div class="section-gap">
            <div class="panel">
                <div class="header">
                    <span>Errors</span>
                </div>
                <div id="errors"></div>
            </div>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const errorsDiv = document.getElementById('errors');
        const endpointInput = document.getElementById('endpointInput');
        const connectButton = document.getElementById('connectButton');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let socket = null;

        function appendMessage(message, type = 'event') {
            const item = document.createElement('div');
            item.textContent = message;

            if (type === 'sent') item.className = 'message-sent';
            else if (type === 'recv') item.className = 'message-recv';
            else if (type === 'error') item.className = 'message-error';
            else item.className = 'message-event';

            messagesDiv.appendChild(item);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function appendError(message) {
            const item = document.createElement('div');
            item.textContent = message;
            item.className = 'message-error';
            errorsDiv.appendChild(item);
            errorsDiv.scrollTop = errorsDiv.scrollHeight;
        }

        function setConnectedState(isConnected) {
            statusDot.classList.toggle('connected', isConnected);
            statusDot.classList.toggle('disconnected', !isConnected);
            statusText.textContent = isConnected ? 'Connected' : 'Disconnected';
            messageInput.disabled = !isConnected;
            sendButton.disabled = !isConnected;
        }

        connectButton.addEventListener('click', () => {
            const endpoint = endpointInput.value.trim();

            if (!endpoint) {
                appendError('[ERR ] WebSocket endpoint is required.');
                return;
            }

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }

            socket = new WebSocket(endpoint);

            socket.addEventListener('open', () => {
                setConnectedState(true);
                appendMessage('[EVT ] Connected to WebSocket server at ' + endpoint, 'event');
            });

            socket.addEventListener('message', (event) => {
                const lines = event.data.split('\n');
                lines.forEach((line) => {
                    if (line) {
                        appendMessage('[RECV] ' + line, 'recv');
                    }
                });
            });

            socket.addEventListener('close', () => {
                setConnectedState(false);
                appendMessage('[EVT ] Disconnected from WebSocket server.', 'event');
            });

            socket.addEventListener('error', (event) => {
                setConnectedState(false);
                appendError('[ERR ] WebSocket connection failed or closed unexpectedly.');
            });
        });

        sendButton.addEventListener('click', () => {
            const message = messageInput.value.trim();

            if (!socket || socket.readyState !== WebSocket.OPEN) {
                appendError('[ERR ] WebSocket is not connected.');
                return;
            }

            if (!message) {
                appendError('[ERR ] Message is empty.');
                return;
            }

            socket.send(message);
            appendMessage('[SENT] ' + message, 'sent');
            messageInput.value = '';
        });

        messageInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                sendButton.click();
            }
        });

        setConnectedState(false);
    </script>
</body>
</html>
